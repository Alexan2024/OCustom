<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#efefef">
<title>ÖMANKÖ — кастом-станция</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="styles.css?v=5">
<link rel="preload" as="image" href="shirt_front.webp">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">ÖMANKÖ <span>custom station</span></div>
    <button class="view-toggle" id="btnPreview" type="button">Как выглядит</button>
  </header>

  <section class="controls">
    <div class="sizes" id="sizes"></div>
    <div class="side-tabs">
      <button class="side-tab active" data-view="front">Перед</button>
      <button class="side-tab" data-view="back">Спина</button>
      <button class="side-tab" data-view="sleeves">Рукава</button>
    </div>
  </section>

  <section class="stage-wrap">
    <!-- Сцену собирает layout(): фото бланка с зоной либо две схемы рукавов -->
    <div class="stage" id="stage"></div>
    <!-- Список положенных принтов: единственный способ взять тот,
         что оказался под соседом -->
    <div class="layers hidden" id="layers"></div>
    <div class="tele" id="tele"></div>
    <div class="sel-tools" id="selTools">
      <button id="btnRotate" title="Повернуть на 90°">⟳ 90°</button>
      <button id="btnDelete" title="Убрать">✕ убрать</button>
    </div>
    <div class="hint" id="hint">Добавь принты из каталога и расставь их. Всё в реальном масштабе.</div>
  </section>

  <footer class="bottom">
    <button class="catalog-btn" id="btnCatalog">+ Принты</button>
    <div class="price" id="price"></div>
    <button class="order-btn" id="btnOrder" disabled>Заказать</button>
  </footer>

  <!-- Каталог -->
  <div class="sheet hidden" id="sheet">
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <div>Принты <span class="muted" id="sheetSide"></span></div>
      <button id="btnCloseSheet">✕</button>
    </div>
    <div class="sheet-filters">
      <input id="catSearch" placeholder="Поиск по названию" autocomplete="off">
      <button class="sort-btn" id="btnSort" type="button">по размеру</button>
    </div>
    <div class="sheet-grid" id="catalog"></div>
  </div>
  <div class="scrim hidden" id="scrim"></div>

  <!-- Оформление: способ получения, получатель, доставка -->
  <div class="overlay full hidden" id="checkout">
    <div class="pane">
      <div class="pane-head">
        <button class="pane-back" id="coBack">←</button>
        <div class="pane-title">Оформление</div>
        <div class="pane-side" id="coGoods"></div>
      </div>
      <div class="pane-body" id="coBody"></div>
      <div class="pane-foot">
        <div class="pane-total" id="coTotal"></div>
        <button class="order-btn" id="coSubmit">Оформить</button>
      </div>
    </div>
  </div>

  <!-- Общий выбиральщик: города и пункты выдачи -->
  <div class="overlay full hidden" id="pick">
    <div class="pane">
      <div class="pane-head">
        <button class="pane-back" id="pickBack">←</button>
        <div class="pane-title" id="pickTitle"></div>
        <div class="pane-side"></div>
      </div>
      <div class="pane-search"><input id="pickInput" autocomplete="off"></div>
      <div class="pane-body" id="pickList"></div>
    </div>
  </div>

  <!-- Экран успеха / просмотра -->
  <div class="overlay hidden" id="overlay"></div>

  <!-- Тосты: подсказки и отмена действия -->
  <div class="toasts" id="toasts"></div>
</div>

<!-- Скелет до ответа /api/config -->
<div class="boot" id="boot">
  <div class="sk row"></div>
  <div class="sk tabs"></div>
  <div class="sk stage"></div>
  <div class="sk bar"></div>
</div>

<script src="app.js?v=5"></script>
</body>
</html>
